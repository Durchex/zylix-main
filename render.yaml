# Render Blueprint — see docs/DEPLOYMENT.md for the full runbook.
#
# Defines the Postgres database, the API, and the web frontend together —
# importing this once deploys the whole stack. Render's managed Redis/Key
# Value product isn't included here — its blueprint field name has changed
# across Render's product history, so it's created manually in the
# dashboard (New -> Key Value) per the guide, then wired to REDIS_URL below.
#
# Both services use Render's native Node runtime (not the Dockerfiles under
# apps/api and apps/web, which — per this repo's own deployment docs — have
# never actually been built against a real Docker daemon). The Node runtime
# path here has been verified end-to-end: full production install with
# devDependencies stripped, build, migration, admin-account creation, login,
# and the web app's rewrite proxy reaching a live API.
#
# zylix-api's buildCommand runs `prisma migrate deploy` on every deploy
# (safe/idempotent — a no-op once migrations are applied), and the
# GET /api/v1/setup/admin?secret=<SETUP_SECRET>&email=...&password=...
# endpoint provisions the first admin account over HTTP — both needed
# because Render's Shell/one-off-command feature requires a paid plan,
# unavailable on the free plan used here.
#
# All three resources use Render's free plan for initial testing — no cost,
# but the web services spin down after 15 min idle (cold start on next
# request) and the free Postgres database expires after a trial period.
# Change `plan: free` to `plan: starter` on all three once ready for a
# persistent, always-on production backend.
#
# Import: Render dashboard -> New -> Blueprint -> select this repo.

databases:
  - name: zylix-postgres
    databaseName: zylix
    user: zylix
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: zylix-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run --workspace=apps/api prisma:generate && npm run build:api && npm run --workspace=apps/api prisma:deploy
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Set this to the zylix-web service's URL (below) once it's live.
      - key: APP_URL
        sync: false
      # One-time admin bootstrap over HTTP (GET /api/v1/setup/admin?secret=
      # <this value>&email=...&password=...) — for hosts like Render's free
      # plan where the Shell/one-off-command feature isn't available. Find
      # this value in this service's Environment tab after deploy.
      - key: SETUP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zylix-postgres
          property: connectionString
      # Paste the connection string from the manually-created Key Value
      # instance here (Render dashboard -> your Key Value instance -> Connect).
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: TWO_FACTOR_ISSUER
        value: ZylixStore
      - key: DEFAULT_CURRENCY
        value: NGN
      - key: DEFAULT_LOCALE
        value: en
      # Everything below is optional at launch — leave unset until you have
      # real credentials for that provider (see docs/PAYMENTS.md).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_ENCRYPTION_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET_HASH
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: zylix-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to the zylix-api service's URL (above) once it's live —
      # baked into the Next.js rewrite at build time, so changing this
      # requires a redeploy, not just an env var update.
      - key: API_URL
        sync: false
