name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# apps/web's tests run entirely against a mocked Mongoose model layer — no
# live MongoDB is needed here. The env vars below are only what
# apps/web/src/server/config/env.ts requires to parse successfully; no real
# secrets are used in CI, and nothing here talks to a live database or
# payment provider.
env:
  MONGODB_URI: mongodb://ci:ci@localhost:27017/ci
  JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
  APP_URL: http://localhost:3000

jobs:
  web:
    name: Web — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      # Only the frontend half is gated here. `typecheck:server` cannot
      # currently complete: type-checking anything that imports the Mongoose
      # models exhausts the heap — a single two-schema model file dies at 4GB,
      # and all of them together survive neither 6GB locally nor a CI runner.
      # Bisecting points at Mongoose's `Model<T>` instantiation in
      # models/base.ts: stub that generic out and the same file type-checks to
      # completion in seconds.
      #
      # So the server layer is currently covered by `next build` (which
      # compiles it) and by the runtime checks, NOT by tsc. Restore the full
      # `npm --prefix apps/web run typecheck` here once that's solved — a red
      # check that can never go green just hides the failures that matter.
      - run: npm --prefix apps/web run typecheck:frontend
      - run: npm run test:web

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  # apps/api (Express + Prisma/Postgres) is decommissioned — see
  # docs/DEPLOYMENT.md §6. It has no CI job any more: typechecking it needs a
  # generated Prisma client, and scripts/postinstall.js deliberately stopped
  # generating one once nothing imported it, so the job could only ever fail.
  # Gating undeployed reference code that way keeps CI permanently red and
  # hides real failures in apps/web. The directory stays in the repo for
  # reference until it's deleted outright.
